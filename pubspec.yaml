name: finalproject2
description: A task management application built with Flutter. 

# Prevent accidental publishing to pub.dev
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk:  '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Material Design icons
  cupertino_icons: ^1.0.6
  
  # ============================================
  # THIRD PARTY PACKAGES (Required:  minimum 2)
  # ============================================
  
  # Package 1: For displaying pie charts on home screen
  fl_chart:  ^0.66.0
  
  # Package 2: For formatting dates in a readable format
  intl: ^0.18.1
  
  # ============================================
  # SQLite Database Packages
  # ============================================
  
  # For local SQL database storage
  sqflite: ^2.3.0
  
  # For constructing database file path
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Assets folder for images (currently empty)
  # assets:
  #   - assets/